name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # v0.6: com SUPABASE_URL e SUPABASE_ANON_KEY o app exige login por convite (sem elas, segue no modo local).
      # Padrão: o projeto Supabase "quaru". As variáveis do repositório (Settings → Secrets and variables → Actions →
      # Variables), se existirem, têm prioridade. São valores PÚBLICOS (URL do projeto e chave anon, protegida pela
      # RLS); a service_role NUNCA entra aqui.
      # v0.12.1: o app mudou para a Vercel (https://app.quaru.com.br). Este endereço antigo continua no ar só para a
      # pessoa levar os dados do aparelho para o novo (botão "Levar meus dados"). Mesmo script de build da Vercel.
      - name: Montar a versão web (endereço antigo, em /quaru)
        env:
          EXPO_PUBLIC_BASE_URL: /quaru
          URL_APP: https://app.quaru.com.br/
        run: bash ../scripts/build-web.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
