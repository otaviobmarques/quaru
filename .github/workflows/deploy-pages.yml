name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      # v0.6: com SUPABASE_URL e SUPABASE_ANON_KEY o app exige login por convite (sem elas, segue no modo local).
      # Padrão: o projeto Supabase "quaru". As variáveis do repositório (Settings → Secrets and variables → Actions →
      # Variables), se existirem, têm prioridade. São valores PÚBLICOS (URL do projeto e chave anon, protegida pela
      # RLS); a service_role NUNCA entra aqui.
      - name: Export web (baseUrl /quaru vem de experiments.baseUrl no app.json)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://gnmbrcdqljhtoxxkuekz.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdubWJyY2RxbGpodG94eGt1ZWt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTY1MjQsImV4cCI6MjEwOTEzMjUyNH0.K3dqSYthWnC2NhLQ6TAVQJhXkwJB2vPZu-ps72Ud2YA' }}
        run: |
          node scripts/gerar-novidades.mjs
          npx expo export --platform web --output-dir dist
      - name: Pós-export (manifest, service worker, 404.html)
        run: node scripts/pos-export-web.mjs dist
      - name: Animações de exercícios e .nojekyll
        run: |
          mkdir -p dist/exercicios
          cp -r --update=none public/exercicios/. dist/exercicios/
          touch dist/.nojekyll
          test -f dist/index.html
      - name: Painel de administração (/quaru/admin/)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || 'https://gnmbrcdqljhtoxxkuekz.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdubWJyY2RxbGpodG94eGt1ZWt6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1NTY1MjQsImV4cCI6MjEwOTEzMjUyNH0.K3dqSYthWnC2NhLQ6TAVQJhXkwJB2vPZu-ps72Ud2YA' }}
          URL_APP: ${{ vars.URL_APP || 'https://otaviobmarques.github.io/quaru/' }}
        run: |
          mkdir -p dist/admin
          cp -r ../admin/. dist/admin/
          node -e "const v={supabaseUrl:process.env.SUPABASE_URL||'',supabaseAnonKey:process.env.SUPABASE_ANON_KEY||'',urlApp:process.env.URL_APP||''};require('fs').writeFileSync('dist/admin/config.js','window.QUARU_ADMIN = '+JSON.stringify(v)+';\n')"
          test -f dist/admin/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
