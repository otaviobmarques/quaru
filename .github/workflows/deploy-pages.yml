name: Publicar no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Export web (baseUrl /quaru vem de experiments.baseUrl no app.json)
        run: |
          node scripts/gerar-novidades.mjs
          npx expo export --platform web --output-dir dist
      - name: Pós-export (manifest, service worker, 404.html)
        run: node scripts/pos-export-web.mjs dist
      - name: Animações de exercícios e .nojekyll
        run: |
          mkdir -p dist/exercicios
          cp -rn public/exercicios/. dist/exercicios/
          touch dist/.nojekyll
          test -f dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
